version: "3.8"

services:
  docker-ms-registry:
    image: docker-ms-registry:latest
    build:
      context: https://github.com/AniaAlex/ms-registry.git#main
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "3030:3030"
    environment:
      - ENV=${ENV:-PRODUCTION}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-key}
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/ms_registry
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      - db
      - redis
    volumes:
      - static_data:/var/www/static
      - media_data:/var/www/media

  db:
    image: postgres:14
    environment:
      - POSTGRES_DB=ms_registry
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:6.2
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  static_data:
  media_data:
