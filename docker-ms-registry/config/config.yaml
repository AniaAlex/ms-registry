service:
  name: "ms-registry-service"
  version: "1.0.0"
  description: "MS Registry Service for Trusted Lists"

server:
  host: "0.0.0.0"
  port: 8000
  socket_port: 3030

database:
  engine: "postgresql"
  host: "db"
  port: 5432
  name: "ms_registry"
  user: "postgres"
  password: "postgres"

redis:
  host: "redis"
  port: 6379
  db: 0

logging:
  level: "info"
  format: "json"
  output: "stdout"

security:
  rate_limit_rps: 100
  enable_cors: true
  allowed_origins:
    - "*"
  secret_key: "${SECRET_KEY}"

static:
  root: "/var/www/static/"
  url: "/static/"

media:
  root: "/var/www/media/"
  url: "/media/"
